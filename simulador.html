<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">

<title>Simulador Abertura</title>

<style>
/* Layout: app de uma tela (cabeçalho, conversa rolando, caixa de mensagem presa embaixo), feito para o polegar no celular */
:root {
  --bg: #06110b; --card: #0c1912; --card2: #112219; --linha: rgba(255,255,255,.10);
  --tx: #f4f7f5; --tx2: rgba(244,247,245,.68); --tx3: rgba(244,247,245,.45);
  --am: #facc15; --ok: #4ade80; --mau: #f87171; --eu: #14532d; --eu2: #166534;
  --disp: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --sys: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.42 var(--sys); -webkit-text-size-adjust: 100%; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
header { flex: none; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--linha); background: var(--bg); }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--am); color: #111; display: grid; place-items: center; font: 800 18px/1 var(--disp); flex: none; }
.tit { flex: 1; min-width: 0; }
.tit button { all: unset; cursor: pointer; display: block; font: 700 17px/1.1 var(--disp); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tit button::after { content: " ▾"; color: var(--tx3); font-size: 13px; }
.st { font: 400 11.5px/1.3 var(--mono); color: var(--tx3); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.st i { width: 7px; height: 7px; border-radius: 50%; background: var(--tx3); flex: none; }
.st.on i { background: var(--ok); box-shadow: 0 0 0 3px rgba(74,222,128,.18); } .st.off i { background: var(--mau); }
.ib { all: unset; cursor: pointer; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--tx2); flex: none; }
.ib:focus-visible, .chip:focus-visible, .env:focus-visible { outline: 2px solid var(--am); outline-offset: 2px; }
.ib svg { width: 22px; height: 22px; }
#lista { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; }
.dia { align-self: center; font: 400 11px var(--mono); color: var(--tx3); background: var(--card); border-radius: 99px; padding: 3px 10px; margin: 8px 0 2px; }
.b { max-width: 84%; padding: 7px 10px 5px; border-radius: 12px; background: var(--card2); align-self: flex-start; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; position: relative; }
.b.cli { align-self: flex-end; background: var(--eu); }
.b.dono { align-self: flex-start; background: #2a2410; border: 1px solid rgba(250,204,21,.35); }
.b.rasc { background: transparent; border: 1px dashed var(--linha); color: var(--tx2); }
.b.narr { background: #0f1d2a; border: 1px solid rgba(147,197,253,.25); }
.b .q { display: block; font: 700 11px var(--mono); color: var(--am); margin-bottom: 2px; letter-spacing: .03em; }
.b .h { display: block; text-align: right; font: 400 10.5px var(--mono); color: var(--tx3); margin-top: 2px; }
.b img, .b video { display: block; max-width: 100%; max-height: 360px; border-radius: 8px; margin: 2px 0 4px; background: #000; }
.b audio { display: block; width: 240px; max-width: 100%; margin: 2px 0; }
.b a { color: var(--am); }
.b .arq { display: inline-flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.25); text-decoration: none; }
.b.pend { opacity: .6; }
.b.erro { outline: 1px solid var(--mau); }
.dig { align-self: flex-start; font: 400 12px var(--mono); color: var(--tx3); padding: 2px 4px; }
.vazio { margin: auto; text-align: center; color: var(--tx2); padding: 20px; max-width: 34ch; display: grid; gap: 10px; }
.vazio b { font: 800 22px/1.1 var(--disp); color: var(--tx); letter-spacing: .02em; }
.chips { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { all: unset; cursor: pointer; white-space: nowrap; font: 500 13px/1 var(--sys); padding: 8px 12px; border-radius: 99px; border: 1px solid var(--linha); color: var(--tx); background: var(--card); }
.chip.pri { border-color: var(--am); color: var(--am); }
.compor { flex: none; display: flex; gap: 6px; align-items: flex-end; padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(10px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--linha); background: var(--bg); }
.caixa { flex: 1; min-width: 0; display: flex; align-items: flex-end; background: var(--card); border: 1px solid var(--linha); border-radius: 22px; padding: 0 4px 0 12px; }
.caixa.dono { border-color: var(--am); }
textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; color: var(--tx); font: 16px/1.35 var(--sys); padding: 10px 0; max-height: 132px; outline: none; }
.env { all: unset; cursor: pointer; width: 46px; height: 46px; border-radius: 50%; background: var(--am); color: #111; display: grid; place-items: center; flex: none; }
.env svg { width: 22px; height: 22px; } .env.grav { background: var(--mau); color: #fff; animation: pulsa 1s infinite; }
@keyframes pulsa { 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .env.grav { animation: none; } }
.folha { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.folha > div { width: 100%; max-width: 760px; max-height: 82%; overflow-y: auto; background: var(--card); border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 8px; }
.folha h3 { margin: 0 0 2px; font: 800 18px/1.1 var(--disp); letter-spacing: .03em; }
.folha p { margin: 0; color: var(--tx2); font-size: 13.5px; }
.op { all: unset; cursor: pointer; display: grid; gap: 2px; padding: 11px 12px; border-radius: 12px; background: var(--card2); border: 1px solid var(--linha); }
.op b { font-weight: 600; } .op small { color: var(--tx2); font-size: 13px; }
.op.at { border-color: var(--am); }
.op:focus-visible { outline: 2px solid var(--am); }
.lin2 { display: flex; gap: 8px; flex-wrap: wrap; }
.lin2 .chip { flex: 1 1 auto; text-align: center; }
.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 6px 2px; }
.chk input { width: 20px; height: 20px; accent-color: #facc15; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); background: #1d2b23; border: 1px solid var(--linha); color: var(--tx); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 30; max-width: calc(100% - 32px); }
.abas { flex: none; display: flex; gap: 4px; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--linha); }
.abas button { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 10px 0 9px; font: 700 15px/1 var(--disp); letter-spacing: .05em; text-transform: uppercase; color: var(--tx3); border-bottom: 3px solid transparent; }
.abas button[aria-selected="true"] { color: var(--am); border-bottom-color: var(--am); }
.abas button:focus-visible { outline: 2px solid var(--am); outline-offset: -2px; }
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#paneEf { overflow-y: auto; overscroll-behavior: contain; padding: 12px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(12px, env(safe-area-inset-left, 0px)); display: block; }
#paneEf[hidden], #paneChat[hidden] { display: none !important; }
.topo { display: grid; gap: 8px; background: var(--card); border: 1px solid var(--linha); border-radius: 14px; padding: 12px; }
.topo p { margin: 0; color: var(--tx2); font-size: 13.5px; }
.topo .lin2 { align-items: center; }
.campo { width: 100%; background: var(--bg); border: 1px solid var(--linha); color: var(--tx); border-radius: 10px; padding: 9px 10px; font: 16px/1.35 var(--sys); resize: vertical; }
.campo.mono { font: 12.5px/1.45 var(--mono); }
#paneEf h2 { font: 700 13px/1 var(--disp); letter-spacing: .12em; text-transform: uppercase; color: var(--tx3); margin: 20px 2px 10px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 156px), 1fr)); gap: 8px; }
.ef { background: var(--card); border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ef.sobre { border-color: var(--am); box-shadow: 0 0 0 3px rgba(250,204,21,.25); }
.ef .mid img, .ef .mid video { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
.ef .mid video { aspect-ratio: auto; max-height: 420px; object-fit: contain; }
.ef .c { padding: 10px 12px 12px; display: grid; gap: 6px; }
.ef .c b { font: 700 16px/1.15 var(--disp); letter-spacing: .02em; }
.ef .c p { margin: 0; color: var(--tx2); font-size: 13px; }
.acao { display: grid; gap: 6px; }
.solta { display: block; text-align: center; border: 1.5px dashed rgba(250,204,21,.6); color: var(--am); border-radius: 10px; padding: 11px 8px; font-size: 13.5px; cursor: pointer; }
.est { font: 400 12px/1.4 var(--mono); color: var(--am); } .est.mau, .mau { color: var(--mau); }
.cod { font: 400 12.5px/1.4 var(--mono); color: var(--ok); } .cod b { font-weight: 700; } .cod a { color: var(--am); }
.nota { width: 100%; background: var(--bg); border: 1px solid var(--linha); color: var(--tx); border-radius: 8px; padding: 8px 9px; font: 15px var(--sys); }
.chip[disabled] { opacity: .5; cursor: default; }
#titEf { font: 700 17px/1.1 var(--disp); letter-spacing: .02em; }
.nm { display: flex; align-items: flex-start; gap: 6px; } .nm b { flex: 1; min-width: 0; }
.lapis { all: unset; cursor: pointer; color: var(--tx3); font-size: 15px; padding: 0 4px; line-height: 1.2; } .lapis:focus-visible { outline: 2px solid var(--am); }
.orig { color: var(--tx3); font: 400 11px var(--mono); }
.guia { font-size: 12.5px; color: var(--tx2); line-height: 1.45; } .guia .gt { color: var(--am); font-weight: 600; } .guia i { color: var(--tx3); font-style: normal; }
.peds { display: flex; gap: 5px; flex-wrap: wrap; }
.ped { all: unset; cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 99px; border: 1px solid var(--linha); color: var(--tx2); }
.ped.on { border-color: var(--am); color: #111; background: var(--am); } .ped:focus-visible { outline: 2px solid var(--am); }
.mat { background: var(--card); border: 1px solid var(--linha); border-radius: 14px; padding: 10px 12px; margin-top: 12px; }
.mat summary { cursor: pointer; font: 700 15px/1.2 var(--disp); letter-spacing: .02em; color: var(--am); }
.mat ul { margin: 10px 0 6px; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; color: var(--tx2); } .mat li b { color: var(--tx); font-weight: 600; }
.mat p { margin: 0; font-size: 12.5px; color: var(--tx3); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">A</div>
    <div class="tit"><div id="titEf">Laboratório de efeitos</div><button id="trocaConv" aria-label="Trocar de conversa" hidden>Conversa 1</button><div class="st" id="st"><i></i><span>conectando ao PC…</span></div></div>
    <button class="ib" id="btTestes" aria-label="O que testar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7 15h10"/></svg></button>
    <button class="ib" id="btMais" aria-label="Opções"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>
  <nav class="abas" role="tablist"><button data-aba="ef" role="tab" aria-selected="true">Efeitos</button><button data-aba="chat" role="tab" aria-selected="false">Testes</button></nav>
  <div id="paneEf" class="pane">
    <div class="topo">
      <p>Arraste (ou toque e escolha) um vídeo ou uma foto no efeito. O PC aplica aquele efeito nos primeiros 7 segundos e mostra aqui. Ficou bom? <b>Salvar como modelo</b>: vai para o seu Drive e ganha um código.</p>
      <label for="labTitulo" style="font-size:13px;color:var(--tx2)">Nome para o enxame de letras e o letreiro</label>
      <input id="labTitulo" class="campo" value="Maria Eduarda|15 anos" autocomplete="off">
      <div class="lin2"><span id="labResumo" style="flex:1 1 160px;font-size:13px;color:var(--tx2)"></span><button class="chip pri" id="btRel">📋 Relatório para o Claude</button></div>
    </div>
    <div id="efLista"></div>
  </div>
  <div id="paneChat" class="pane" hidden>
  <div id="lista" aria-live="polite"></div>
  <div class="chips" id="atalhos"></div>
  <div class="compor">
    <button class="ib" id="btAnexo" aria-label="Mandar foto, vídeo, áudio ou arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.5 7.6"/></svg></button>
    <input type="file" id="arq" hidden accept="image/*,video/*,audio/*,application/pdf,.zip,.doc,.docx">
    <div class="caixa" id="caixa"><textarea id="txt" rows="1" placeholder="Mensagem (você é o cliente)" aria-label="Mensagem"></textarea></div>
    <button class="env" id="env" aria-label="Gravar áudio"><svg id="icMic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg id="icEnv" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M3.4 20.4 21 12 3.4 3.6l.1 6.6L15 12 3.5 13.8z"/></svg></button>
  </div>
  </div>
</div>

  if (!doPc && p.tipo === 'efeitoSalvar') { const j = LABP.jobs[p.job]; if (j) { j.salvando = true; j.nota = p.nota || j.nota; } }
  if (doPc) {
    const j = LABP.jobs[p.job] = LABP.jobs[p.job] || { chave: p.chave, em: e.time * 1000 };
    if (!LABP.porChave[p.chave] || (LABP.jobs[LABP.porChave[p.chave]] || {}).em <= j.em) LABP.porChave[p.chave] = p.job;
    if (p.tipo === 'efeitoStatus') { j.st = p.txt; j.erro = !!p.erro; }
    if (p.tipo === 'efeitoPronto') { j.st = ''; j.erro = false; j.url = anexo && anexo.url; j.pronto = true; }
    if (p.tipo === 'efeitoSalvo') {
      j.salvando = false; j.codigo = p.codigo; j.drive = p.drive || ''; j.driveErro = p.driveErro || '';
      const m = modelos.find(x => x.codigo === p.codigo) || (modelos.push({ codigo: p.codigo }), modelos[modelos.length - 1]);
      Object.assign(m, { chave: p.chave, nome: nomeEf(p.chave), drive: p.drive || m.drive || '', nota: j.nota || m.nota || '', em: m.em || e.time * 1000, job: p.job });
      LS.set('modelos', modelos);
    }
  }
  LS.set('labChave', LABP.porChave);
  labCard(p.chave); labTopo();
}
function labCard(chave) {

  if (j && j.codigo) h += '<div class="cod"><b>' + esc(j.codigo) + '</b>' + (j.drive ? ' · <a href="' + esc(j.drive) + '" target="_blank" rel="noopener">no Drive</a>' : j.driveErro ? ' · <span class="mau">Drive: ' + esc(j.driveErro) + '</span>' : '') + '</div>';

    + '<button class="chip pri" data-salvar="' + chave + '"' + (j.salvando ? ' disabled' : '') + '>' + (j.salvando ? 'Salvando no Drive…' : '💾 Salvar como modelo') + '</button>';
  const ocupado = j && !j.pronto && !j.erro && !j.codigo;
  if (!ocupado) h += '<label class="solta">' + (j ? '↻ Trocar o vídeo' : '＋ Arraste ou toque: vídeo (7 s) ou foto') + '<input type="file" accept="video/*,image/*" data-arq="' + chave + '" hidden></label>';

/* preparar o arquivo no celular: foto até 1600 px; vídeo grande vira um trecho de 7 s em 720p (gravado aqui mesmo) */
function dimsDe(arquivo) {
  return new Promise(ok => {
    const u = URL.createObjectURL(arquivo), fim = (w, h) => { URL.revokeObjectURL(u); ok({ w, h }); };
    if (/^image\//.test(arquivo.type)) { const i = new Image(); i.onload = () => fim(i.naturalWidth, i.naturalHeight); i.onerror = () => fim(16, 9); i.src = u; }
    else { const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; v.playsInline = true; v.onloadedmetadata = () => fim(v.videoWidth || 16, v.videoHeight || 9); v.onerror = () => fim(16, 9); v.src = u; }
  });
}
async function fotoMenor(arquivo) {
  const bmp = await createImageBitmap(arquivo), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const b = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.86)); return new File([b], 'foto.jpg', { type: 'image/jpeg' });
}
async function trecho7s(arquivo, aviso) {
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.src = URL.createObjectURL(arquivo);
  await new Promise((ok, no) => { v.onloadeddata = ok; v.onerror = () => no(new Error('não consegui abrir esse vídeo aqui')); });
  const k = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight)), cv = document.createElement('canvas');
  cv.width = Math.round(v.videoWidth * k / 2) * 2; cv.height = Math.round(v.videoHeight * k / 2) * 2;
  const g = cv.getContext('2d'), st = cv.captureStream(30);
  const tipo = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(st, Object.assign({ videoBitsPerSecond: 6e6 }, tipo ? { mimeType: tipo } : {})), partes = [];
  rec.ondataavailable = e => e.data.size && partes.push(e.data);
  const dur = Math.min(7, v.duration || 7);
  await v.play();
  rec.start(250);
  await new Promise(ok => {
    const t0 = performance.now();
    const passo = () => { g.drawImage(v, 0, 0, cv.width, cv.height); const s = (performance.now() - t0) / 1000; aviso('preparando o trecho… ' + Math.min(7, Math.floor(s)) + '/7 s'); if (s >= dur || v.ended) return ok(); requestAnimationFrame(passo); };
    passo();
  });
  rec.stop(); v.pause(); await new Promise(ok => { rec.onstop = ok; });
  URL.revokeObjectURL(v.src);
  const mime = (rec.mimeType || 'video/webm').split(';')[0];
  return new File([new Blob(partes, { type: mime })], 'trecho.' + (mime === 'video/mp4' ? 'mp4' : 'webm'), { type: mime });
}
async function labEnviar(chave, arquivo) {
  if (!K) return toast('Abra pelo link do PC primeiro.');
  const job = chave.slice(0, 10).replace(/_/g, '') + '-' + novoId();
  const j = LABP.jobs[job] = { chave, st: 'preparando…', em: Date.now() }; LABP.porChave[chave] = job; labCard(chave);
  const aviso = t => { j.st = t; labCard(chave); };
  try {
    if (!/^(video|image)\//.test(arquivo.type)) throw new Error('mande um vídeo ou uma foto');
    const d = await dimsDe(arquivo), formato = d.h > d.w ? '9:16' : '16:9';
    let f = arquivo;
    if (/^image\//.test(arquivo.type) && arquivo.size > 1.5e6) f = await fotoMenor(arquivo);
    if (/^video\//.test(arquivo.type) && arquivo.size > 12e6) { try { f = await trecho7s(arquivo, aviso); } catch (x) { throw new Error('vídeo grande demais e não consegui cortar aqui (' + x.message + '). Corte para 7 s no app de fotos e mande de novo.'); } }
    if (f.size > 15e6) throw new Error('ainda passou de 15 MB: corte o vídeo para 7 s no app de fotos');
    aviso('enviando para o PC…');
    const tit = ($('labTitulo').value || '').trim();
    const r = await fetch(URL_IN() + '?filename=' + encodeURIComponent(f.name || 'arquivo') + '&message=' + encodeURIComponent(JSON.stringify({ v: 1, tipo: 'efeito', job, chave, formato, titulo: tit })), { method: 'PUT', body: f });
    if (!r.ok) throw new Error(r.status === 429 ? 'limite de mensagens do canal; tente mais tarde' : 'o canal recusou (' + r.status + ')');
    aviso('enviado, esperando o PC…');
    setTimeout(() => { if (LABP.jobs[job] && !LABP.jobs[job].pronto && /esperando o PC/.test(LABP.jobs[job].st || '')) aviso('o PC ainda não pegou (ele confere a cada 6 s; o WhatsApp Web está aberto?)'); }, 45000);
  } catch (x) { j.st = '⚠ ' + x.message; j.erro = true; labCard(chave); }
}

  const s = e.target.closest('[data-salvar]'); if (!s) return;

});
['dragover', 'dragenter'].forEach(ev => $('efLista').addEventListener(ev, e => { const c = e.target.closest('.ef'); if (c) { e.preventDefault(); c.classList.add('sobre'); } }));

/* relatório para o Claude: tudo o que ele precisa para atualizar o código */
function relatorio() {
  const agora = new Date().toLocaleString('pt-BR'), linhas = ['RELATÓRIO DO LABORATÓRIO DE EFEITOS · Abertura CRM', 'Data: ' + agora + (versaoPc ? ' · extensão ' + versaoPc : ''), ''];
  linhas.push('MODELOS SALVOS (' + modelos.length + ')' + (modelos.length ? ':' : ': nenhum'));
  modelos.forEach((m, i) => { linhas.push((i + 1) + '. ' + m.codigo + ' · ' + (m.nome || nomeEf(m.chave)) + ' (id: ' + m.chave + ')'); if (m.drive) linhas.push('   Drive: ' + m.drive); if (m.nota) linhas.push('   Nota: ' + m.nota); });
  const testados = Object.values(LABP.jobs).filter(j => j.pronto && !j.codigo), erros = Object.values(LABP.jobs).filter(j => j.erro);
  if (testados.length) { linhas.push('', 'TESTADOS E NÃO SALVOS:'); testados.forEach(j => linhas.push('- ' + nomeEf(j.chave) + ' (id: ' + j.chave + ')' + (j.nota ? ' · nota: ' + j.nota : ''))); }
  if (erros.length) { linhas.push('', 'ERROS:'); erros.forEach(j => linhas.push('- ' + nomeEf(j.chave) + ' (id: ' + j.chave + '): ' + String(j.st || '').replace(/^⚠\s*/, ''))); }
  const ren = Object.entries(nomes), peds = Object.entries(pedidos);
  if (ren.length) { linhas.push('', 'NOMES NOVOS (trocar na extensão):'); ren.forEach(([id, n]) => linhas.push('- ' + id + ': "' + nomeOriginal(id) + '" → "' + n + '"')); }
  if (peds.length) { linhas.push('', 'PEDIDOS DE FUNÇÃO NOVA:'); peds.forEach(([id, o]) => linhas.push('- ' + nomeEf(id) + ' (id: ' + id + '): ' + [o.fundo && 'recortar o fundo (DJ/pessoa/objeto) antes do efeito', o.tres && 'transformar o objeto/pessoa em 3D'].filter(Boolean).join(' + '))); }
  const obs = ($('labObs') && $('labObs').value.trim()) || LS.get('labObs', '');
  linhas.push('', 'O QUE EU QUERO MUDAR:', obs || '(nada escrito)', '', 'Pedido: use os modelos acima como exemplos fixos na página de efeitos da extensão, troque os nomes, crie as funções pedidas e ajuste o motor conforme as notas.');
  return linhas.join('\n');
}
